<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagnóstico ISO 9001 · Templum</title>
<meta name="description" content="6 perguntas sobre a gestão da qualidade. O resultado aparece na hora.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFAEB">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFAEB;
    --surface:#fff;
    --text:#18191B;
    --text-2:#3F424B;
    --navy:#222831;
    --orange:#FF5925;
    --orange-hover:#AF4022;
    --ink:#B23C0C;
    --border:rgba(24,25,27,.12);
    --track:rgba(24,25,27,.08);
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Montserrat,system-ui,sans-serif;
    font-weight:500;
    line-height:1.45;
    padding:20px 16px 40px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{display:flex;align-items:center;margin-bottom:18px;}
  header img{height:28px;width:auto;background:#fff;border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);}
  .card{
    background:var(--surface);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:22px 20px 20px;
  }
  .progress{display:flex;gap:5px;margin-bottom:18px;}
  .progress i{flex:1;height:6px;border-radius:99px;background:var(--track);overflow:hidden;}
  .progress i b{display:block;height:100%;width:0;background:var(--orange);border-radius:99px;}
  .progress i.done b{width:100%;}
  .progress i.now b{width:55%;}
  .intro{font-size:14.5px;color:var(--text-2);margin:0 0 16px;}
  .step{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px;}
  .step strong{color:var(--ink);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:11px;}
  h1{font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-.02em;margin:0 0 18px;}
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{display:block;cursor:pointer;}
  .opt input{position:absolute;opacity:0;pointer-events:none;}
  .opt span{
    display:flex;align-items:center;gap:12px;
    border:1.5px solid var(--border);border-radius:14px;
    padding:14px 14px;background:var(--bg);font-weight:700;font-size:15px;
  }
  .opt span::before{
    content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--border);
    flex:none;box-shadow:inset 0 0 0 4px transparent;background:#fff;
  }
  .opt input:checked + span{border-color:var(--ink);background:rgba(255,89,37,.08);}
  .opt input:checked + span::before{border-color:var(--ink);box-shadow:inset 0 0 0 4px var(--ink);}
  .opt input:focus-visible + span{outline:2px solid var(--ink);outline-offset:2px;}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;}
  button,.btn{
    font-family:inherit;font-weight:800;font-size:15px;border:0;cursor:pointer;
    border-radius:999px;padding:14px 22px;
  }
  .btn-next{background:var(--ink);color:#fff;margin-left:auto;}
  .btn-next:hover{background:var(--orange-hover);}
  .btn-next:disabled{opacity:.35;cursor:not-allowed;}
  .btn-back{background:transparent;color:var(--text-2);padding-left:0;}
  .result-top{text-align:center;padding-bottom:6px;}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);}
  .score{font-size:56px;font-weight:900;letter-spacing:-.04em;line-height:1;margin:8px 0 4px;}
  .level{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .lead{color:var(--text-2);font-size:14.5px;margin:10px auto 0;max-width:420px;}
  .fronts{display:flex;flex-direction:column;gap:12px;margin-top:22px;}
  .front{background:var(--bg);border-radius:16px;padding:12px 14px;}
  .front-top{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:14px;}
  .bar{height:6px;border-radius:99px;background:var(--track);margin:8px 0;overflow:hidden;}
  .bar b{display:block;height:100%;background:var(--orange);border-radius:99px;}
  .front p{margin:0;font-size:13.5px;color:var(--text-2);}
  .next{
    margin-top:22px;background:var(--navy);color:#FFFAEB;border-radius:20px;padding:18px 16px 16px;
  }
  .next h2{margin:0 0 6px;font-size:20px;line-height:1.25;font-weight:800;}
  .next > p{margin:0 0 14px;font-size:14px;color:#C7C4B6;}
  form{display:flex;flex-direction:column;gap:8px;}
  input{
    font-family:inherit;font-size:15px;font-weight:500;color:var(--text);
    border:0;border-radius:12px;padding:13px 14px;width:100%;background:#fff;
  }
  input:focus{outline:2px solid var(--orange);outline-offset:1px;}
  .btn-send{background:var(--orange);color:#fff;width:100%;margin-top:4px;}
  .btn-send:hover{background:var(--orange-hover);}
  .btn-send:disabled{opacity:.55;cursor:not-allowed;}
  .fine{margin:8px 0 0;font-size:12px;color:#C7C4B6;text-align:center;}
  .gate .fine{color:var(--text-2);}
  .gate h1{font-size:22px;margin-bottom:8px;}
  .gate > p{margin:0 0 16px;color:var(--text-2);font-size:14.5px;}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .btn-no{background:transparent;color:#FFFAEB;border:1.5px solid rgba(255,250,235,.4);width:100%;}
  .ask-msg{min-height:1.2em;margin:8px 0 0;font-size:13px;font-weight:700;color:#FDB73F;text-align:center;}
  .form-msg{min-height:1.2em;margin:0;font-size:13px;font-weight:700;color:#FDB73F;}
  .ok{background:var(--navy);color:#FFFAEB;border-radius:20px;padding:16px;font-weight:700;margin-top:22px;}
  .again{
    display:block;margin:16px auto 0;background:none;color:var(--text-2);
    font-size:13px;font-weight:700;text-decoration:underline;padding:8px;
  }
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/assets/logo/templum.png" alt="Templum" width="120" height="40">
  </header>

  <section class="card" id="quiz">
    <p class="intro" id="intro">6 perguntas curtas sobre como a empresa faz hoje. No final, a nota.</p>
    <div class="progress" id="progress"></div>
    <p class="step" id="step"></p>
    <h1 id="qText"></h1>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button type="button" class="btn-back" id="backBtn">Voltar</button>
      <button type="button" class="btn-next" id="nextBtn" disabled>Próxima</button>
    </div>
  </section>

  <section class="card gate" id="gate" hidden>
    <h1>Sua nota está pronta.</h1>
    <p>Informe o contato para ver o resultado e o que mais trava a gestão.</p>
    <form id="leadForm" novalidate>
      <input id="fNome" name="nome" type="text" autocomplete="name" placeholder="Nome" required>
      <input id="fTel" name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="WhatsApp" required>
      <input id="fEmail" name="email" type="email" autocomplete="email" placeholder="E-mail" required>
      <input id="fEmp" name="empresa" type="text" autocomplete="organization" placeholder="Empresa" required>
      <button class="btn-send" id="sendBtn" type="submit">Ver meu diagnóstico</button>
      <p class="form-msg" id="formMsg" role="alert"></p>
      <p class="fine">Sem compromisso. Usamos estes dados só para este contato.</p>
    </form>
  </section>

  <section class="card" id="result" hidden>
    <div class="result-top">
      <div class="eyebrow">Seu diagnóstico</div>
      <div class="score" id="score">0%</div>
      <div class="level" id="level"></div>
      <p class="lead" id="summary"></p>
    </div>
    <div class="fronts" id="fronts"></div>
    <div class="next" id="ask">
      <h2 id="askTitle"></h2>
      <p id="askCopy"></p>
      <div class="choices" id="askChoices">
        <button type="button" class="btn-send" id="yesBtn">Sim, quero contato</button>
        <button type="button" class="btn-no" id="noBtn">Agora não</button>
      </div>
      <p class="ask-msg" id="askMsg" role="alert"></p>
    </div>
    <div class="ok" id="thanks" hidden></div>
    <button type="button" class="again" id="againBtn">Refazer as perguntas</button>
  </section>
</div>
<script>
(function () {
  "use strict";

  var OPTS = [
    "Não",
    "Às vezes",
    "Sim",
    "Sempre"
  ];

  var QUESTIONS = [
    {
      name: "Estratégia",
      text: "O que fica combinado na reunião vira tarefa no dia a dia?",
      gaps: [
        "O combinado da reunião fica na reunião.",
        "Às vezes vira tarefa, cada um de um jeito.",
        "O combinado vira tarefa no dia a dia. A revisão ainda falha.",
        "O combinado vira tarefa e o andamento é revisto."
      ]
    },
    {
      name: "Riscos e oportunidades",
      text: "Quando alguém avisa que algo pode dar errado, a empresa age antes de estourar?",
      gaps: [
        "O aviso só vira assunto quando o problema já estourou.",
        "O time avisa, mas a ação nem sempre sai.",
        "A empresa age antes de estourar. A revisão ainda falha.",
        "O aviso vira ação e é revisto quando o cenário muda."
      ]
    },
    {
      name: "Processos",
      text: "Se o serviço sai errado ou o pedido atrasa, o time sabe o que fazer na hora?",
      gaps: [
        "Quando sai errado, cada um resolve do próprio jeito.",
        "Às vezes há um combinado, mas na hora cada um improvisa.",
        "O time sabe o que fazer na hora. Falta rever se segurou.",
        "O erro tem um jeito de resolver, e esse jeito é revisado."
      ]
    },
    {
      name: "Pessoas",
      text: "Depois de treinar alguém, a empresa confere se o trabalho melhorou?",
      gaps: [
        "O treinamento acaba e ninguém olha se o trabalho melhorou.",
        "Às vezes alguém olha, sem um jeito definido.",
        "A empresa confere se o trabalho melhorou. Falta usar isso para ajustar.",
        "O treinamento é revisto pelo que a pessoa passa a fazer no trabalho."
      ]
    },
    {
      name: "Indicadores",
      text: "Quando a meta do mês não fecha, a empresa monta um plano?",
      gaps: [
        "A meta do mês não fecha e a conversa acaba na reunião.",
        "Às vezes sai um plano, no improviso.",
        "O plano sai. Falta checar se o número voltou.",
        "O plano é acompanhado até o número voltar."
      ]
    },
    {
      name: "Cliente",
      text: "O que o cliente reclama muda o jeito de trabalhar?",
      gaps: [
        "A reclamação do cliente não muda o trabalho.",
        "A reclamação chega, mas quase não muda o jeito de trabalhar.",
        "A reclamação muda o jeito de trabalhar.",
        "A empresa muda o trabalho e o cliente fica sabendo."
      ]
    }
  ];

  var SUMMARIES = [
    "A gestão ainda depende de memória e de apagar incêndio.",
    "Parte da gestão já tem um jeito definido. Outra parte ainda é improviso.",
    "O padrão existe na maior parte. O que falta é revisar e manter.",
    "As seis áreas já têm padrão e revisão."
  ];

  var CONTENT_NAME = "diagnostico-iso-9001-campanha";
  var WA_RE = /^(?:1[1-9]|2[12478]|3[1-578]|4[1-9]|5[13-5]|6[1-9]|7[134579]|8[1-9]|9[1-9])9\d{8}$/;

  var answers = QUESTIONS.map(function () { return null; });
  var current = 0;
  var result = null;

  var quizEl = document.getElementById("quiz");
  var gateEl = document.getElementById("gate");
  var resultEl = document.getElementById("result");
  var pessoa = null;
  var progressEl = document.getElementById("progress");
  var stepEl = document.getElementById("step");
  var qText = document.getElementById("qText");
  var optsEl = document.getElementById("opts");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");

  function levelOf(pct) {
    if (pct < 26) return { label: "Inicial", summary: 0 };
    if (pct < 51) return { label: "Em desenvolvimento", summary: 1 };
    if (pct < 76) return { label: "Estruturado", summary: 2 };
    return { label: "Avançado", summary: 3 };
  }

  function renderProgress() {
    progressEl.innerHTML = "";
    QUESTIONS.forEach(function (_, i) {
      var seg = document.createElement("i");
      if (i < current) seg.className = "done";
      else if (i === current) seg.className = "now";
      seg.appendChild(document.createElement("b"));
      progressEl.appendChild(seg);
    });
  }

  function renderQuestion() {
    var q = QUESTIONS[current];
    renderProgress();
    document.getElementById("intro").hidden = current !== 0;
    stepEl.innerHTML = "<strong>" + q.name + "</strong> · " + (current + 1) + " de " + QUESTIONS.length;
    qText.textContent = q.text;
    optsEl.innerHTML = "";
    OPTS.forEach(function (label, idx) {
      var id = "q" + current + "o" + idx;
      var lab = document.createElement("label");
      lab.className = "opt";
      lab.innerHTML = '<input type="radio" name="q" id="' + id + '" value="' + idx + '"><span></span>';
      lab.querySelector("span").textContent = label;
      if (answers[current] === idx) lab.querySelector("input").checked = true;
      lab.querySelector("input").addEventListener("change", function () {
        answers[current] = idx;
        nextBtn.disabled = false;
      });
      optsEl.appendChild(lab);
    });
    backBtn.hidden = current === 0;
    nextBtn.disabled = answers[current] === null;
    nextBtn.textContent = current === QUESTIONS.length - 1 ? "Ver minha nota" : "Próxima";
  }

  function showQuiz() {
    resultEl.hidden = true;
    gateEl.hidden = true;
    quizEl.hidden = false;
    renderQuestion();
    window.scrollTo(0, 0);
  }

  function buildResult() {
    var rows = QUESTIONS.map(function (q, i) {
      var pct = Math.round((answers[i] / 3) * 100);
      var lvl = levelOf(pct);
      return {
        name: q.name,
        pct: pct,
        level: lvl.label,
        gap: q.gaps[answers[i]],
        answer: OPTS[answers[i]],
        order: i
      };
    });
    var overall = Math.round(rows.reduce(function (sum, row) { return sum + row.pct; }, 0) / rows.length);
    var overallLevel = levelOf(overall);
    var ranked = rows.slice().sort(function (a, b) {
      return a.pct - b.pct || a.order - b.order;
    });
    return { overall: overall, level: overallLevel.label, summary: SUMMARIES[overallLevel.summary], rows: ranked, raw: rows };
  }

  function showResult() {
    result = buildResult();
    document.getElementById("score").textContent = result.overall + "%";
    document.getElementById("level").textContent = result.level;
    document.getElementById("summary").textContent = result.summary;
    var box = document.getElementById("fronts");
    box.innerHTML = "";
    result.rows.forEach(function (row) {
      var el = document.createElement("article");
      el.className = "front";
      el.innerHTML =
        '<div class="front-top"><span></span><span></span></div>' +
        '<div class="bar"><b></b></div><p></p>';
      el.querySelectorAll(".front-top span")[0].textContent = row.name;
      el.querySelectorAll(".front-top span")[1].textContent = row.pct + "%";
      el.querySelector(".bar b").style.width = row.pct + "%";
      el.querySelector("p").textContent = row.gap;
      box.appendChild(el);
    });
    var weak = result.rows[0];
    document.getElementById("askTitle").textContent = "O que mais trava hoje é " + weak.name + ".";
    document.getElementById("askCopy").textContent = weak.gap + " Quer que a gente entre em contato para resolver isso?";
    document.getElementById("ask").hidden = false;
    document.getElementById("askChoices").hidden = false;
    document.getElementById("askMsg").textContent = "";
    document.getElementById("thanks").hidden = true;
    document.getElementById("againBtn").hidden = false;
    quizEl.hidden = true;
    gateEl.hidden = true;
    resultEl.hidden = false;
    window.scrollTo(0, 0);
  }

  function showGate() {
    result = buildResult();
    quizEl.hidden = true;
    resultEl.hidden = true;
    gateEl.hidden = false;
    window.scrollTo(0, 0);
  }

  backBtn.addEventListener("click", function () {
    if (current === 0) return;
    current -= 1;
    renderQuestion();
  });
  nextBtn.addEventListener("click", function () {
    if (answers[current] === null) return;
    if (current < QUESTIONS.length - 1) {
      current += 1;
      renderQuestion();
      return;
    }
    showGate();
  });
  document.getElementById("againBtn").addEventListener("click", function () {
    answers = QUESTIONS.map(function () { return null; });
    current = 0;
    result = null;
    pessoa = null;
    var form = document.getElementById("leadForm");
    delete form.dataset.sent;
    form.reset();
    document.getElementById("formMsg").textContent = "";
    var sendBtn = document.getElementById("sendBtn");
    sendBtn.disabled = false;
    sendBtn.textContent = "Ver meu diagnóstico";
    document.getElementById("yesBtn").disabled = false;
    document.getElementById("noBtn").disabled = false;
    showQuiz();
  });

  function digitsBR(raw) {
    var d = String(raw || "").replace(/\D/g, "");
    if (d.indexOf("55") === 0 && d.length >= 12) d = d.slice(2);
    return d.slice(0, 11);
  }

  var tel = document.getElementById("fTel");
  tel.addEventListener("input", function () {
    var d = digitsBR(tel.value);
    if (d.length <= 2) tel.value = d ? "(" + d : "";
    else if (d.length <= 7) tel.value = "(" + d.slice(0, 2) + ") " + d.slice(2);
    else tel.value = "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
  });

  function cookie(name) {
    var m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return m ? decodeURIComponent(m.pop()) : "";
  }
  function uuid() {
    try { return crypto.randomUUID(); }
    catch (e) { return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  }
  function mensagem() {
    var lines = [
      "Diagnóstico ISO 9001, campanha.",
      "Nota geral: " + result.overall + "% (" + result.level + ").",
      "Ponto mais fraco: " + result.rows[0].name + ". " + result.rows[0].gap
    ];
    result.raw.forEach(function (row) {
      lines.push(row.name + ": " + row.pct + "% (" + row.level + "). Resposta: " + row.answer + ".");
    });
    return lines.join("\n");
  }

  document.getElementById("leadForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var form = ev.currentTarget;
    var msg = document.getElementById("formMsg");
    var btn = document.getElementById("sendBtn");
    var nome = document.getElementById("fNome").value.trim();
    var email = document.getElementById("fEmail").value.trim();
    var empresa = document.getElementById("fEmp").value.trim();
    var telDigits = digitsBR(tel.value);
    msg.textContent = "";
    if (nome.length < 2) { msg.textContent = "Informe seu nome."; document.getElementById("fNome").focus(); return; }
    if (!WA_RE.test(telDigits)) { msg.textContent = "Informe um WhatsApp com DDD. Ex.: (11) 99999-0000"; tel.focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = "Informe um e-mail válido."; document.getElementById("fEmail").focus(); return; }
    if (empresa.length < 2) { msg.textContent = "Informe a empresa."; document.getElementById("fEmp").focus(); return; }
    if (form.dataset.sent === "1") return;
    form.dataset.sent = "1";
    btn.disabled = true;
    btn.textContent = "Enviando...";
    pessoa = { nome: nome, email: email, telefone: "+55" + telDigits, empresa: empresa };

    var params = new URLSearchParams(location.search);
    var leadEventId = uuid();
    var payload = {
      nome: nome,
      email: email,
      telefone: "+55" + telDigits,
      empresa: empresa,
      norma: "ISO 9001",
      evento: CONTENT_NAME,
      mensagem: mensagem(),
      pagina: location.pathname,
      landing: location.href,
      meta_event_id: leadEventId,
      lead_event_id: leadEventId,
      meta_content_name: CONTENT_NAME,
      fbp: cookie("_fbp"),
      fbc: cookie("_fbc")
    };
    ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "gclid", "fbclid", "gbraid", "wbraid"].forEach(function (key) {
      var value = params.get(key);
      if (value) payload[key] = value;
    });

    var ready = window.tplTurnstileToken ? window.tplTurnstileToken() : Promise.reject();
    ready.then(function (token) {
      payload.turnstile_token = token;
      return fetch("/api/lead", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { ok: r.ok, body: body };
        });
      });
    }).then(function (res) {
      if (window.tplTurnstileReset) window.tplTurnstileReset();
      if (!res.ok || !res.body || res.body.ok !== true) {
        delete form.dataset.sent;
        btn.disabled = false;
        btn.textContent = "Ver meu diagnóstico";
        msg.textContent = "Não conseguimos enviar agora. Tente de novo.";
        return;
      }
      try {
        if (typeof fbq === "function") {
          fbq("track", "Lead", { content_name: CONTENT_NAME }, { eventID: leadEventId });
        }
      } catch (err) {}
      showResult();
    }).catch(function () {
      if (window.tplTurnstileReset) window.tplTurnstileReset();
      delete form.dataset.sent;
      btn.disabled = false;
      btn.textContent = "Ver meu diagnóstico";
      msg.textContent = "Não conseguimos enviar agora. Tente de novo.";
    });
  });

  function sendChoice(choice) {
    if (!pessoa || !result) return;
    var yesBtn = document.getElementById("yesBtn");
    var noBtn = document.getElementById("noBtn");
    var askMsg = document.getElementById("askMsg");
    if (yesBtn.disabled) return;
    yesBtn.disabled = true;
    noBtn.disabled = true;
    askMsg.textContent = "";
    var weak = result.rows[0];
    var note = choice === "sim"
      ? "Pediu contato para resolver: " + weak.name + ". " + weak.gap
      : "Viu o diagnóstico e não pediu contato. Ponto mais fraco: " + weak.name + ".";
    var payload = {
      nome: pessoa.nome,
      email: pessoa.email,
      telefone: pessoa.telefone,
      empresa: pessoa.empresa,
      norma: "ISO 9001",
      evento: CONTENT_NAME,
      contato: choice,
      mensagem: note,
      pagina: location.pathname,
      landing: location.href,
      meta_content_name: CONTENT_NAME
    };
    var params = new URLSearchParams(location.search);
    ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "gclid", "fbclid", "gbraid", "wbraid"].forEach(function (key) {
      var value = params.get(key);
      if (value) payload[key] = value;
    });
    var ready = window.tplTurnstileToken ? window.tplTurnstileToken() : Promise.reject();
    ready.then(function (token) {
      payload.turnstile_token = token;
      return fetch("/api/lead", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { ok: r.ok, body: body };
        });
      });
    }).then(function (res) {
      if (window.tplTurnstileReset) window.tplTurnstileReset();
      if (!res.ok || !res.body || res.body.ok !== true) {
        yesBtn.disabled = false;
        noBtn.disabled = false;
        askMsg.textContent = "Não conseguimos registrar agora. Tente de novo.";
        return;
      }
      document.getElementById("ask").hidden = true;
      document.getElementById("againBtn").hidden = true;
      var thanks = document.getElementById("thanks");
      thanks.hidden = false;
      thanks.textContent = choice === "sim"
        ? "Recebemos. O time entra em contato por este WhatsApp."
        : "Certo. O diagnóstico fica com você.";
    }).catch(function () {
      if (window.tplTurnstileReset) window.tplTurnstileReset();
      yesBtn.disabled = false;
      noBtn.disabled = false;
      askMsg.textContent = "Não conseguimos registrar agora. Tente de novo.";
    });
  }
  document.getElementById("yesBtn").addEventListener("click", function () { sendChoice("sim"); });
  document.getElementById("noBtn").addEventListener("click", function () { sendChoice("nao"); });

  showQuiz();
})();
</script>
<script src="/js/tpl-turnstile.js?v=3"></script>
</body>
